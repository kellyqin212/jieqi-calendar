name: Suishi
options:
  bundleIdPrefix: app.suishi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: NO
packages:
  JieqiCore:
    path: Packages/JieqiCore
targets:
  Suishi:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Resources
        excludes:
          - "Illustrations/**"
      - path: App/Resources/Illustrations
        type: folder
    dependencies:
      - package: JieqiCore
        product: JieqiCore
      - target: SuishiWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.suishi.calendar
        PRODUCT_NAME: Suishi
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SuishiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Shared
      - path: App/Resources/Fonts
      - path: App/Resources/Illustrations
        type: folder
    dependencies:
      - package: JieqiCore
        product: JieqiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.suishi.calendar.widget
        PRODUCT_NAME: SuishiWidget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SuishiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: JieqiCore
        product: JieqiCore
      - target: Suishi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.suishi.calendar.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suishi.app/Suishi"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  Suishi:
    build:
      targets:
        Suishi: all
        SuishiWidget: all
        SuishiTests: [test]
    run:
      storeKitConfiguration: Config/Configuration.storekit
      language: zh-Hans
      region: CN
    test:
      targets:
        - SuishiTests
      language: zh-Hans
      region: CN
