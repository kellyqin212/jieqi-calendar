name: Screenshots

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: bash scripts/select-xcode.sh

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Boot the simulator and capture the UI
        run: bash scripts/screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/home.png
            screenshots/term.png
            screenshots/festival.png
            screenshots/month.png
            screenshots/about.png
            screenshots/widgets.png
          if-no-files-found: error
