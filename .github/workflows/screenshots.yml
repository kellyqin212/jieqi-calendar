name: Screenshots

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: bash scripts/select-xcode.sh

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Boot the simulator and capture the UI
        run: bash scripts/screenshots.sh

      - name: Upload home screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-home
          path: screenshots/home.png
          if-no-files-found: error

      - name: Upload month screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-month
          path: screenshots/month.png
          if-no-files-found: error

      - name: Upload about screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-about
          path: screenshots/about.png
          if-no-files-found: error

      - name: Upload widget screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-widgets
          path: screenshots/widgets.png
          if-no-files-found: error
